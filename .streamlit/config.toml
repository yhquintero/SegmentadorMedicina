# Configuración de la vista Web — SegmentadorMedicina
[theme]
base = "light"
primaryColor = "#574be0"
backgroundColor = "#f4f6ff"
secondaryBackgroundColor = "#eef0fc"
textColor = "#141a3d"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
enableStaticServing = true
maxUploadSize = 2000

[browser]
gatherUsageStats = false