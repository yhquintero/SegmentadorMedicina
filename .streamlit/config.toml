$contenido = @'
# Configuración de la vista Web — SegmentadorMedicina
[theme]
base = "light"
primaryColor = "#574be0"
backgroundColor = "#f4f6ff"
secondaryBackgroundColor = "#eef0fc"
textColor = "#141a3d"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
# Permite servir archivos estáticos (static/hero.jpg) para el héroe del Panel.
enableStaticServing = true
# Libros de Medicina: archivos grandes (hasta 2 GB).
maxUploadSize = 2000

[browser]
gatherUsageStats = false
'@

$ruta = ".streamlit\config.toml"
$utf8SinBom = New-Object System.Text.UTF8Encoding $false
[System.IO.File]::WriteAllText((Resolve-Path $ruta), $contenido, $utf8SinBom)
Write-Host "✅ config.toml reescrito en UTF-8 sin BOM" -ForegroundColor Green